name: Test UV Cookiecutter

on:
  pull_request: {}
  push:
    branches: master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
        os: [ubuntu-latest]

    name: Python ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - run: curl -sfL https://direnv.net/install.sh | bash

      - name: Check TOML/YAML/whitespace
        run: |
          uv run -- prek run --all-files --show-diff-on-failure --color=always \
            check-toml \
            check-yaml \
            trailing-whitespace \
            end-of-file-fixer

      - run: uv run rumdl fmt --check --diff .
      - run: uv run rumdl check .

      - run: uv run ruff format --check --diff .
      - run: uv run ruff check .

      - run: uv run ty check

      - run: uv run pytest --cov --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "default@example.com"
          git config --global user.name "Default Name"
          git config --global init.defaultBranch master

      - name: Run cookiecutter
        run: uvx cookiecutter . --no-input --config-file template_config.yml -o ..

      - name: Move to new package and run checks
        run: |
          cd ../uv_project
          direnv allow .
          uv run prek run -a --stage pre-push
